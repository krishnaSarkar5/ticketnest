services:
  location-service:
    image: krishnasarkar/ticketnest-location-service
    container_name: location-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=jdbc:postgresql://location-db:5432/postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
    ports:
      - "8081:8081"
    restart: unless-stopped
    depends_on:
      location-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 700m

  theatre-service:
    image: krishnasarkar/ticketnest-theatre-service
    container_name: theatre-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=jdbc:postgresql://theatre-db:5432/postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - RABBITMQ_HOST=ticketnest-rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
    ports:
      - "8082:8082"
    restart: unless-stopped
    depends_on:
      location-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 700m